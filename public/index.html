<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flag Memory Match (Multiplayer)</title>
<style>
  :root {
    --bg: #f4f1ea; --card-back: #2b2b3d; --card-back-2: #3d3d55; --accent: #e2725b;
    --text: #22222a; --muted: #7a7a85; --tile-bg: #ffffff; --win-bg: #e2725b;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #16161f; --text: #f0efe9; --muted: #9a9aa5; --tile-bg: #23232f; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column; align-items: center;
    padding: 16px; min-height: 100%;
  }
  .wrap { width: 100%; max-width: 480px; display: flex; flex-direction: column; align-items: center; gap: 14px; }
  h1 { font-size: 1.4rem; margin: 0; }
  .mode-tabs { display: flex; gap: 8px; width: 100%; }
  .mode-tabs button {
    flex: 1; padding: 10px 6px; border-radius: 10px; border: 1px solid transparent;
    background: var(--tile-bg); color: var(--text); font-size: 0.85rem; cursor: pointer;
  }
  .mode-tabs button.active { border-color: var(--accent); color: var(--accent); font-weight: 600; }
  .hud { display: flex; justify-content: space-between; width: 100%; font-size: 0.95rem; color: var(--muted); flex-wrap: wrap; gap: 6px; }
  .hud b { color: var(--text); }
  .stepper {
    display: flex; align-items: center; justify-content: space-between; width: 100%;
    background: var(--tile-bg); border-radius: 10px; padding: 8px 12px;
  }
  .stepper button { width: 36px; height: 36px; border-radius: 8px; border: none; background: var(--accent); color: white; font-size: 1.2rem; cursor: pointer; }
  .stepper span { font-weight: 600; font-size: 1.05rem; }
  .panel { width: 100%; display: flex; flex-direction: column; gap: 10px; }
  .hidden { display: none; }
  .remote-box { width: 100%; background: var(--tile-bg); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  .remote-box input[type="text"] {
    width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--muted);
    background: var(--bg); color: var(--text); font-size: 1rem;
  }
  .code-input { text-align: center; text-transform: uppercase; letter-spacing: 0.15em; }
  .remote-row { display: flex; gap: 8px; }
  .remote-row button, .full-btn {
    padding: 10px; border-radius: 8px; border: none; background: var(--accent);
    color: white; font-weight: 600; cursor: pointer; flex: 1;
  }
  .code-display {
    text-align: center; font-size: 1.8rem; font-weight: 700; letter-spacing: 0.25em;
    padding: 10px; background: var(--bg); border-radius: 10px;
  }
  .status-line { font-size: 0.85rem; color: var(--muted); text-align: center; }
  .difficulty { display: flex; gap: 8px; width: 100%; }
  .difficulty button {
    flex: 1; padding: 8px 6px; border-radius: 10px; border: 1px solid transparent;
    background: var(--tile-bg); color: var(--text); font-size: 0.85rem; cursor: pointer;
  }
  .difficulty button.active { border-color: var(--accent); color: var(--accent); font-weight: 600; }
  .pool-control { width: 100%; display: flex; flex-direction: column; gap: 4px; font-size: 0.85rem; color: var(--muted); }
  .pool-control input[type="range"] { width: 100%; accent-color: var(--accent); }
  .scoreboard { width: 100%; display: flex; flex-wrap: wrap; gap: 6px; }
  .score-chip {
    flex: 1 1 auto; min-width: 90px; background: var(--tile-bg); border-radius: 10px;
    padding: 8px 10px; font-size: 0.8rem; text-align: center; border: 2px solid transparent;
  }
  .score-chip.current { border-color: var(--accent); }
  .score-chip .p-name { display: block; color: var(--muted); font-size: 0.72rem; }
  .score-chip .p-score { display: block; font-weight: 700; font-size: 1.05rem; }
  .score-chip .p-countries {
    display: block; margin-top: 4px; font-size: 1rem; line-height: 1.5;
    letter-spacing: 1px; max-height: 3em; overflow-y: auto; word-break: break-all;
  }
  .board { display: grid; gap: 8px; width: 100%; touch-action: manipulation; }
  .tile {
    aspect-ratio: 1 / 1; border-radius: 12px;
    background: linear-gradient(135deg, var(--card-back), var(--card-back-2));
    display: flex; align-items: center; justify-content: center; cursor: pointer;
    user-select: none; -webkit-tap-highlight-color: transparent;
    -webkit-transform-style: preserve-3d; transform-style: preserve-3d;
    transition: -webkit-transform 0.6s ease; transition: transform 0.6s ease;
    position: relative;
  }
  .tile.flipped, .tile.matched {
    background: var(--tile-bg);
    -webkit-transform: rotateY(180deg); transform: rotateY(180deg);
  }
  .tile .face {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    -webkit-backface-visibility: hidden; backface-visibility: hidden;
    border-radius: 12px; padding: 2px; text-align: center; overflow: hidden;
  }
  .tile .front { -webkit-transform: rotateY(180deg); transform: rotateY(180deg); }
  .tile .front .flag { font-size: clamp(1.3rem, 7vw, 2.8em); line-height: 1; }
  .tile .front .name {
    font-size: clamp(0.5rem, 2.4vw, 0.85rem); line-height: 1.05; color: var(--muted); margin-top: 2px;
    max-width: 100%; overflow: hidden; white-space: normal; word-break: break-word;
    font-weight: 600;
  }
  .tile .front .name.name-long { font-size: clamp(0.4rem, 1.9vw, 0.65rem); }
  .tile .front .name.name-xl-long { font-size: clamp(0.32rem, 1.5vw, 0.5rem); }
  .tile.matched { cursor: default; }
  .tile.empty-slot {
    background: transparent;
    cursor: default;
    -webkit-transform: none; transform: none;
  }
  .tile.disabled { pointer-events: none; }
  .win-banner {
    display: none; width: 100%; background: var(--win-bg); color: white;
    padding: 14px; border-radius: 12px; text-align: center; font-weight: 600;
  }
  .win-banner.show { display: block; }
  .controls { display: flex; gap: 10px; width: 100%; }
  .controls button {
    flex: 1; padding: 12px; border-radius: 10px; border: 1px solid var(--muted);
    background: var(--tile-bg); color: var(--text); font-size: 1rem; font-weight: 600; cursor: pointer;
  }
  @media (max-width: 480px) {
    body { padding: 8px 8px calc(env(safe-area-inset-bottom, 8px) + 8px); }
    .wrap { gap: 8px; padding-top: 4px; }
    h1 { font-size: 1.1rem; }
    .mode-tabs button { padding: 7px 4px; font-size: 0.72rem; }
    .difficulty button { padding: 6px 4px; font-size: 0.72rem; }
    .pool-control { font-size: 0.72rem; }
    .score-chip { padding: 5px 6px; font-size: 0.68rem; min-width: 56px; }
    .score-chip .p-name { font-size: 0.62rem; }
    .score-chip .p-score { font-size: 0.85rem; }
    .controls button { padding: 9px; font-size: 0.85rem; }
    .board { gap: 4px; }
    .remote-box { padding: 10px; }
    .status-line { font-size: 0.72rem; }
    .code-display { font-size: 1.3rem; padding: 8px; }
  }
  @media (max-width: 360px) {
    h1 { font-size: 1rem; }
    .mode-tabs button, .difficulty button { padding: 6px 3px; font-size: 0.65rem; }
    .board { gap: 3px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Flag Memory Match</h1>

  <div class="mode-tabs" id="modeTabs">
    <button data-mode="solo" class="active">Solo</button>
    <button data-mode="local">Local Multiplayer</button>
    <button data-mode="remote">Remote Multiplayer</button>
  </div>

  <!-- SOLO PANEL -->
  <div class="panel" id="soloPanel">
    <div class="hud">
      <span>Moves: <b id="soloMoves">0</b></span>
      <span>Time: <b id="soloTimer">0:00</b></span>
      <span>Best: <b id="soloBest">--</b></span>
    </div>
  </div>

  <!-- LOCAL SETUP -->
  <div class="panel hidden" id="localSetupPanel">
    <div class="stepper">
      <button id="localMinus">-</button>
      <span><span id="localCount">2</span> players</span>
      <button id="localPlus">+</button>
    </div>
    <button id="localStartBtn" class="full-btn">Start Local Game</button>
  </div>

  <!-- LOCAL IN-GAME HUD -->
  <div class="panel hidden" id="localGamePanel">
    <div class="scoreboard" id="localScoreboard"></div>
  </div>

  <!-- SHARED DIFFICULTY / POOL for Solo + Local -->
  <div class="panel" id="soloLocalDifficultyPanel">
    <div class="difficulty" id="soloLocalDifficulty">
      <button data-size="4" class="active">Easy (4x4)</button>
      <button data-size="6">Medium (6x6)</button>
      <button data-size="8">Hard (8x8)</button>
    </div>
    <div class="pool-control">
      <label>Countries in pool: <b id="soloLocalPoolLabel">194</b></label>
      <input type="range" id="soloLocalPoolSlider" min="20" max="194" value="194">
    </div>
  </div>

  <!-- REMOTE SETUP -->
  <div class="panel hidden" id="remoteSetupPanel">
    <div class="remote-box">
      <input type="text" id="nameInput" placeholder="Your name" maxlength="16">
      <button class="full-btn" id="hostBtn">Host a Game</button>
      <div style="text-align:center;color:var(--muted);font-size:0.8rem;">or</div>
      <div class="remote-row">
        <input type="text" id="codeInput" class="code-input" placeholder="Room code" maxlength="5" style="flex:2;">
        <button id="joinBtn" style="flex:1;">Join</button>
      </div>
      <div class="status-line" id="statusLine">Connecting to server...</div>
    </div>
  </div>

  <!-- REMOTE LOBBY -->
  <div class="panel hidden" id="remoteLobbyPanel">
    <div class="remote-box">
      <div class="status-line">Room code, share this with players</div>
      <div class="code-row" style="display:flex;gap:8px;align-items:center;">
        <div class="code-display" id="lobbyCode" style="flex:1;">----</div>
        <button id="copyCodeBtn" style="padding:10px 14px;border-radius:10px;border:none;background:var(--accent);color:white;font-weight:600;cursor:pointer;white-space:nowrap;">Copy</button>
      </div>
      <div class="difficulty" id="difficulty">
        <button data-size="4" class="active">Easy (4x4)</button>
        <button data-size="6">Medium (6x6)</button>
        <button data-size="8">Hard (8x8)</button>
      </div>
      <div class="pool-control">
        <label>Countries in pool: <b id="poolLabel">194</b></label>
        <input type="range" id="poolSlider" min="20" max="194" value="194">
      </div>
      <div class="scoreboard" id="lobbyPlayers"></div>
      <button class="full-btn" id="startBtn">Start Game</button>
      <div class="status-line" id="lobbyStatus">Waiting for host to start...</div>
    </div>
  </div>

  <!-- REMOTE IN-GAME HUD -->
  <div class="panel hidden" id="remoteGamePanel">
    <div class="scoreboard" id="scoreboard"></div>
    <div class="status-line" id="turnStatus"></div>
  </div>

  <div class="win-banner" id="winBanner"></div>
  <div class="board" id="board"></div>

  <div class="controls" id="mainControls">
    <button id="restartBtn">Restart</button>
    <button id="newBtn">New Shuffle</button>
  </div>

  <div class="controls hidden" id="remoteExitControls">
    <button id="newGameBtn" style="background:var(--accent);color:white;border:none;">New Game</button>
    <button id="leaveBtn">Leave Game</button>
  </div>
</div>

  let mode = "solo"; // solo | local | remote
  let size = 4;
  let poolSize = MAX_COUNTRIES;
  let tiles = [];
  let flipped = [];
  let matchedCount = 0;
  let lock = false;

  let ws = null;
  let myId = null;
  let roomCode = null;
  let isHost = false;
  let chosenSize = 4;
  let chosenPool = 194;
  let lastState = null;

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  function buildDeck(gridSize, poolLimit) {
    const pairCount = (gridSize * gridSize) / 2;
    const pool = shuffle(COUNTRIES.slice(0, poolLimit).slice());
    let picks;
    if (pairCount <= pool.length) {
      picks = shuffle(pool).slice(0, pairCount);
    } else {
      picks = [];
      for (let i = 0; i < pairCount; i++) picks.push(pool[i % pool.length]);
    }
    return shuffle(picks.concat(picks));
  }

  function fitTileContent(face) {
    const flag = face.querySelector(".flag");
    const name = face.querySelector(".name");
    if (!flag || !name) return;
    let flagSize = parseFloat(getComputedStyle(flag).fontSize);
    let nameSize = parseFloat(getComputedStyle(name).fontSize);
    let guard = 0;
    while (face.scrollHeight > face.clientHeight + 1 && guard < 40) {
      flagSize *= 0.93;
      nameSize *= 0.93;
      flag.style.fontSize = flagSize + "px";
      name.style.fontSize = nameSize + "px";
      guard++;
      if (flagSize < 6 && nameSize < 5) break;
    }
  }

  function fitAllTiles() {
    boardEl.querySelectorAll(".tile:not(.empty-slot) .face.front").forEach((face) => {
      fitTileContent(face);
    });
  }

  function onTileClick(idx) {
    if (mode === "solo") return soloTileClick(idx);
    if (mode === "local") return localTileClick(idx);
    if (mode === "remote") return tileClick(idx);
  }

  function renderBoard() {
    boardEl.style.gridTemplateColumns = "repeat(" + size + ", 1fr)";
    boardEl.innerHTML = "";
    tiles.forEach((tile, idx) => {
      const el = document.createElement("div");
      if (tile.matched) {
        el.className = "tile empty-slot";
        tile.el = el;
        boardEl.appendChild(el);
        return;
      }
      el.className = "tile";
      if (tile.flipped) el.classList.add("flipped");
      const nameCls = tile.name.length > 24 ? "name name-xl-long" : (tile.name.length > 17 ? "name name-long" : "name");
      el.innerHTML =
        '<div class="face back"></div>' +
        '<div class="face front"><span class="flag">' + tile.symbol + '</span><span class="' + nameCls + '">' + escapeHtml(tile.name) + '</span></div>';
      el.addEventListener("click", () => onTileClick(idx));
      tile.el = el;
      boardEl.appendChild(el);
    });
    fitAllTiles();
  }

  // ==================================================
  // SOLO MODE
  // ==================================================
  let soloMoves = 0;
  let soloSeconds = 0;
  let soloTimerHandle = null;
  let soloStarted = false;

  function soloStorageKey() { return "memory-match-best-" + size + "x" + size; }

  function soloLoadBest() {
    try {
      const v = localStorage.getItem(soloStorageKey());
      soloBestEl.textContent = v ? formatTime(parseInt(v, 10)) : "--";
    } catch (e) { soloBestEl.textContent = "--"; }
  }

  function soloSaveBestIfBetter(finalSeconds) {
    try {
      const key = soloStorageKey();
      const prev = localStorage.getItem(key);
      if (!prev || finalSeconds < parseInt(prev, 10)) {
        localStorage.setItem(key, String(finalSeconds));
        soloLoadBest();
      }
    } catch (e) { /* ignore */ }
  }

  function formatTime(s) {
    const m = Math.floor(s / 60);
    const sec = s % 60;
    return m + ":" + String(sec).padStart(2, "0");
  }

  function soloStartTimer() {
    soloStopTimer();
    soloSeconds = 0;
    soloTimerEl.textContent = formatTime(0);
    soloTimerHandle = setInterval(() => {
      soloSeconds++;
      soloTimerEl.textContent = formatTime(soloSeconds);
    }, 1000);
  }
  function soloStopTimer() {
    if (soloTimerHandle) { clearInterval(soloTimerHandle); soloTimerHandle = null; }
  }

  function soloTileClick(idx) {
    const tile = tiles[idx];
    if (lock || tile.matched || tile.flipped) return;
    if (!soloStarted) { soloStarted = true; soloStartTimer(); }

    tile.flipped = true;
    tile.el.classList.add("flipped");
    flipped.push(idx);

    if (flipped.length === 2) {
      soloMoves++;
      soloMovesEl.textContent = soloMoves;
      lock = true;
      const [aIdx, bIdx] = flipped;
      const a = tiles[aIdx], b = tiles[bIdx];
      if (a.symbol === b.symbol) {
        a.matched = true; b.matched = true;
        matchedCount += 2;
        flipped = [];
        setTimeout(() => {
          a.el.className = "tile empty-slot"; a.el.innerHTML = "";
          b.el.className = "tile empty-slot"; b.el.innerHTML = "";
          lock = false;
          if (matchedCount === tiles.length) soloWin();
        }, 700);
      } else {
        setTimeout(() => {
          a.el.classList.add("wrong"); b.el.classList.add("wrong");
          setTimeout(() => {
            a.flipped = false; b.flipped = false;
            a.el.classList.remove("flipped", "wrong");
            b.el.classList.remove("flipped", "wrong");
            flipped = []; lock = false;
          }, 400);
        }, 500);
      }
    }
  }

  function soloWin() {
    soloStopTimer();
    soloSaveBestIfBetter(soloSeconds);
    winBanner.textContent = "Solved in " + soloMoves + " moves, " + formatTime(soloSeconds) + "!";
    winBanner.classList.add("show");
  }

  function soloNewGame() {
    soloStopTimer();
    soloStarted = false;
    soloMoves = 0;
    matchedCount = 0;
    flipped = [];
    lock = false;
    soloMovesEl.textContent = "0";
    soloTimerEl.textContent = "0:00";
    winBanner.classList.remove("show");
    const deck = buildDeck(size, poolSize);
    tiles = deck.map((c) => ({ symbol: c.flag, name: c.name, flipped: false, matched: false, el: null }));
    renderBoard();
    soloLoadBest();
  }

  // ==================================================
  // LOCAL MULTIPLAYER MODE
  // ==================================================
  let localPlayerCount = 2;
  let localScores = [];
  let localCountries = [];
  let localCurrent = 0;

  localMinus.addEventListener("click", () => {
    localPlayerCount = Math.max(MIN_LOCAL_PLAYERS, localPlayerCount - 1);
    localCountEl.textContent = localPlayerCount;
  });
  localPlus.addEventListener("click", () => {
    localPlayerCount = Math.min(MAX_LOCAL_PLAYERS, localPlayerCount + 1);
    localCountEl.textContent = localPlayerCount;
  });
  localStartBtn.addEventListener("click", () => {
    localSetupPanel.classList.add("hidden");
    localGamePanel.classList.remove("hidden");
    startLocalGame();
  });

  function renderLocalScoreboard() {
    localScoreboard.innerHTML = "";
    localScores.forEach((score, i) => {
      const chip = document.createElement("div");
      chip.className = "score-chip" + (i === localCurrent ? " current" : "");
      chip.style.borderColor = i === localCurrent ? PLAYER_COLORS[i % PLAYER_COLORS.length] : "transparent";
      const countriesText = (localCountries[i] || []).join(" ");
      chip.innerHTML =
        '<span class="p-name">Player ' + (i + 1) + '</span>' +
        '<span class="p-score">' + score + '</span>' +
        '<span class="p-countries">' + escapeHtml(countriesText) + '</span>';
      localScoreboard.appendChild(chip);
    });
  }

  function localTileClick(idx) {
    const tile = tiles[idx];
    if (lock || tile.matched || tile.flipped) return;
    tile.flipped = true;
    tile.el.classList.add("flipped");
    flipped.push(idx);

    if (flipped.length === 2) {
      lock = true;
      const [aIdx, bIdx] = flipped;
      const a = tiles[aIdx], b = tiles[bIdx];
      if (a.symbol === b.symbol) {
        a.matched = true; b.matched = true;
        matchedCount += 2;
        localScores[localCurrent]++;
        localCountries[localCurrent].push(a.symbol);
        flipped = [];
        renderLocalScoreboard();
        setTimeout(() => {
          a.el.className = "tile empty-slot"; a.el.innerHTML = "";
          b.el.className = "tile empty-slot"; b.el.innerHTML = "";
          lock = false;
          if (matchedCount === tiles.length) localWin();
        }, 700);
      } else {
        setTimeout(() => {
          a.el.classList.add("wrong"); b.el.classList.add("wrong");
          setTimeout(() => {
            a.flipped = false; b.flipped = false;
            a.el.classList.remove("flipped", "wrong");
            b.el.classList.remove("flipped", "wrong");
            flipped = []; lock = false;
            localCurrent = (localCurrent + 1) % localPlayerCount;
            renderLocalScoreboard();
          }, 400);
        }, 500);
      }
    }
  }

  function localWin() {
    let winnerIdx = 0;
    for (let i = 1; i < localScores.length; i++) {
      if (localScores[i] > localScores[winnerIdx]) winnerIdx = i;
    }
    const tie = localScores.filter((s) => s === localScores[winnerIdx]).length > 1;
    winBanner.textContent = tie ? "It's a tie!" : "Player " + (winnerIdx + 1) + " wins!";
    winBanner.classList.add("show");
  }

  function startLocalGame() {
    localScores = new Array(localPlayerCount).fill(0);
    localCountries = new Array(localPlayerCount).fill(null).map(() => []);
    localCurrent = 0;
    matchedCount = 0;
    flipped = [];
    lock = false;
    winBanner.classList.remove("show");
    const deck = buildDeck(size, poolSize);
    tiles = deck.map((c) => ({ symbol: c.flag, name: c.name, flipped: false, matched: false, el: null }));
    renderBoard();
    renderLocalScoreboard();
  }

  // ==================================================
  // MODE SWITCHING
  // ==================================================
  function setMode(newMode) {
    mode = newMode;
    modeTabs.querySelectorAll("button").forEach((b) => b.classList.toggle("active", b.dataset.mode === mode));

    soloPanel.classList.add("hidden");
    localSetupPanel.classList.add("hidden");
    localGamePanel.classList.add("hidden");
    remoteSetupPanel.classList.add("hidden");
    remoteLobbyPanel.classList.add("hidden");
    remoteGamePanel.classList.add("hidden");
    remoteExitControls.classList.add("hidden");
    soloLocalDifficultyPanel.classList.remove("hidden");
    mainControls.classList.remove("hidden");
    winBanner.classList.remove("show");
    boardEl.innerHTML = "";

    if (mode === "solo") {
      soloPanel.classList.remove("hidden");
      soloNewGame();
    } else if (mode === "local") {
      localSetupPanel.classList.remove("hidden");
      mainControls.classList.add("hidden");
    } else if (mode === "remote") {
      remoteSetupPanel.classList.remove("hidden");
      soloLocalDifficultyPanel.classList.add("hidden");
      mainControls.classList.add("hidden");
    }
  }

  modeTabs.querySelectorAll("button").forEach((btn) => {
    btn.addEventListener("click", () => setMode(btn.dataset.mode));
  });

  soloLocalDifficultyBtns.forEach((btn) => {
    btn.addEventListener("click", () => {
      soloLocalDifficultyBtns.forEach((b) => b.classList.remove("active"));
      btn.classList.add("active");
      size = parseInt(btn.dataset.size, 10);
      if (mode === "solo") soloNewGame();
    });
  });
  soloLocalPoolSlider.max = String(MAX_COUNTRIES);
  soloLocalPoolSlider.value = String(MAX_COUNTRIES);
  soloLocalPoolLabel.textContent = MAX_COUNTRIES;
  soloLocalPoolSlider.addEventListener("input", () => {
    poolSize = parseInt(soloLocalPoolSlider.value, 10);
    soloLocalPoolLabel.textContent = poolSize;
  });
  soloLocalPoolSlider.addEventListener("change", () => {
    if (mode === "solo") soloNewGame();
  });

  restartBtn.addEventListener("click", () => { if (mode === "solo") soloNewGame(); });
  newBtn.addEventListener("click", () => { if (mode === "solo") soloNewGame(); });

  // ==================================================
  // REMOTE MULTIPLAYER MODE (unchanged logic, renamed panel refs)
  // ==================================================

  function connect() {
    const proto = location.protocol === "https:" ? "wss:" : "ws:";
    ws = new WebSocket(proto + "//" + location.host);
    ws.onopen = () => { statusLine.textContent = "Connected. Host or join a game."; };
    ws.onclose = () => { statusLine.textContent = "Disconnected from server. Refresh to reconnect."; };
    ws.onerror = () => { statusLine.textContent = "Connection error."; };
    ws.onmessage = (evt) => {
      let msg;
      try { msg = JSON.parse(evt.data); } catch (e) { return; }
      if (msg.type === "joined") {
        myId = msg.youId;
        roomCode = msg.code;
      } else if (msg.type === "error") {
        statusLine.textContent = msg.message;
      } else if (msg.type === "state") {
        renderState(msg.state);
      }
    };
  }
  connect();

  hostBtn.addEventListener("click", () => {
    if (!ws || ws.readyState !== WebSocket.OPEN) return;
    const name = (nameInput.value || "Host").trim().slice(0, 16) || "Host";
    isHost = true;
    ws.send(JSON.stringify({ type: "host", name }));
  });

  joinBtn.addEventListener("click", () => {
    if (!ws || ws.readyState !== WebSocket.OPEN) return;
    const name = (nameInput.value || "Player").trim().slice(0, 16) || "Player";
    const code = (codeInput.value || "").trim().toUpperCase();
    if (!code) { statusLine.textContent = "Enter a room code."; return; }
    isHost = false;
    ws.send(JSON.stringify({ type: "join", code, name }));
  });

  difficultyBtns.forEach((btn) => {
    btn.addEventListener("click", () => {
      difficultyBtns.forEach((b) => b.classList.remove("active"));
      btn.classList.add("active");
      chosenSize = parseInt(btn.dataset.size, 10);
    });
  });
  poolSlider.addEventListener("input", () => {
    chosenPool = parseInt(poolSlider.value, 10);
    poolLabel.textContent = chosenPool;
  });

  startBtn.addEventListener("click", () => {
    ws.send(JSON.stringify({ type: "start", size: chosenSize, poolSize: chosenPool }));
  });

  leaveBtn.addEventListener("click", () => {
    ws.send(JSON.stringify({ type: "leave" }));
    location.reload();
  });

  copyCodeBtn.addEventListener("click", () => {
    if (!roomCode) return;
    const done = () => {
      const original = copyCodeBtn.textContent;
      copyCodeBtn.textContent = "Copied!";
      setTimeout(() => { copyCodeBtn.textContent = original; }, 1500);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(roomCode).then(done).catch(() => fallbackCopy(roomCode, done));
    } else {
      fallbackCopy(roomCode, done);
    }
  });

  function fallbackCopy(text, done) {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    try { document.execCommand("copy"); done(); } catch (e) {}
    document.body.removeChild(ta);
  }

  newGameBtn.addEventListener("click", () => {
    if (!lastState) return;
    ws.send(JSON.stringify({ type: "start", size: lastState.size, poolSize: lastState.poolSize }));
  });

  function tileClick(idx) {
    ws.send(JSON.stringify({ type: "flip", index: idx }));
  }

  function renderState(state) {
    lastState = state;
    if (state.status === "lobby") {
      remoteSetupPanel.classList.add("hidden");
      remoteLobbyPanel.classList.remove("hidden");
      remoteGamePanel.classList.add("hidden");
      boardEl.innerHTML = "";
      winBanner.classList.remove("show");
      lobbyCode.textContent = roomCode;
      const amHost = state.players[0] && state.players[0].id === myId;
      startBtn.style.display = amHost ? "block" : "none";
      lobbyStatus.textContent = amHost ? "Share the code above. Start when everyone's in." : "Waiting for host to start...";
      lobbyPlayers.innerHTML = "";
      state.players.forEach((p) => {
        const chip = document.createElement("div");
        chip.className = "score-chip";
        chip.innerHTML = '<span class="p-name">' + escapeHtml(p.name) + (p.id === myId ? " (you)" : "") + (p.connected ? "" : " (offline)") + '</span>';
        lobbyPlayers.appendChild(chip);
      });
      return;
    }

    remoteSetupPanel.classList.add("hidden");
    remoteLobbyPanel.classList.add("hidden");
    remoteGamePanel.classList.remove("hidden");
    remoteExitControls.classList.remove("hidden");

    boardEl.style.gridTemplateColumns = "repeat(" + state.size + ", 1fr)";
    boardEl.innerHTML = "";
    const currentPlayer = state.players[state.turnIndex];
    const myTurn = currentPlayer && currentPlayer.id === myId;

    state.tiles.forEach((t, idx) => {
      const el = document.createElement("div");
      if (t.matched) {
        el.className = "tile empty-slot";
        boardEl.appendChild(el);
        return;
      }
      el.className = "tile";
      if (t.flipped) el.classList.add("flipped");
      if (!myTurn || state.status === "finished") el.classList.add("disabled");
      const nameCls = t.name.length > 24 ? "name name-xl-long" : (t.name.length > 17 ? "name name-long" : "name");
      el.innerHTML =
        '<div class="face back"></div>' +
        '<div class="face front"><span class="flag">' + t.flag + '</span><span class="' + nameCls + '">' + escapeHtml(t.name) + '</span></div>';
      el.addEventListener("click", () => tileClick(idx));
      boardEl.appendChild(el);
    });
    fitAllTiles();

    scoreboard.innerHTML = "";
    state.players.forEach((p, i) => {
      const chip = document.createElement("div");
      chip.className = "score-chip" + (i === state.turnIndex ? " current" : "");
      chip.style.borderColor = i === state.turnIndex ? PLAYER_COLORS[i % PLAYER_COLORS.length] : "transparent";
      const countriesText = (p.countries || []).join(" ");
      chip.innerHTML =
        '<span class="p-name">' + escapeHtml(p.name) + (p.id === myId ? " (you)" : "") + (p.connected ? "" : " (offline)") + '</span>' +
        '<span class="p-score">' + p.score + '</span>' +
        '<span class="p-countries">' + escapeHtml(countriesText) + '</span>';
      scoreboard.appendChild(chip);
    });

    if (state.status === "finished") {
      const winner = state.players.find((p) => p.id === state.winnerId);
      turnStatus.textContent = winner ? (winner.name + " wins!") : "It's a tie!";
      winBanner.textContent = turnStatus.textContent;
      winBanner.classList.add("show");
      const amHost = state.players[0] && state.players[0].id === myId;
      newGameBtn.style.display = amHost ? "block" : "none";
      if (!amHost) turnStatus.textContent += " Waiting for host to start a new game...";
    } else {
      turnStatus.textContent = myTurn ? "Your turn" : (currentPlayer ? currentPlayer.name + "'s turn" : "");
      winBanner.classList.remove("show");
      newGameBtn.style.display = "none";
    }
  }

  setMode("solo");
})();
</script>
</body>
</html>
